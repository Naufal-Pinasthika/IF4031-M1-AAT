<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Analitik · BNPB</title>
<style>
:root{color-scheme:light;--ink:#1d1d1f;--muted:#6e6e73;--canvas:#f5f5f7;--panel:#fff;--primary:#0066cc;--focus:#0071e3;--hairline:#d2d2d7;--warning:#9b4400;--danger:#b42318;font:17px/1.47 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.374px;color:var(--ink);background:var(--canvas)}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit;letter-spacing:inherit}a{color:inherit;text-decoration:none}button,a,input{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus)}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button:active{transform:scale(.95)}
main{max-width:1216px;margin:auto;padding:64px 32px 32px}.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:40px}h1{font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:56px;line-height:1.07;font-weight:600;letter-spacing:-.28px;margin:0}.status-badge{flex-shrink:0;font-size:12px;letter-spacing:-.12px;color:var(--muted);background:#e8e8ed;padding:8px 14px;border-radius:9999px}.status-badge.ok{color:var(--ink)}.status-badge.warn{color:var(--warning);background:#fff0e0}
.controls-panel{margin-bottom:24px;padding:24px;border-radius:18px;background:var(--panel)}.toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.toolbar label{display:grid;gap:8px;min-width:0;color:var(--muted);font-size:12px;letter-spacing:-.12px}.token-field{flex:1;min-width:220px}.toolbar input{height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--hairline);padding:10px 16px;border-radius:8px;min-width:0;width:100%;font-size:14px}.toolbar input::placeholder{color:var(--muted)}.toolbar input[type=date]{width:164px}.refresh{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:9999px;background:var(--primary);color:#fff;padding:11px 22px;font-size:14px}.refresh svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}.message{color:var(--muted);font-size:14px;letter-spacing:-.224px;margin:0 0 24px;padding:0 4px;overflow-wrap:anywhere}.message:empty{display:none}.message.warn{color:var(--warning)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-bottom:24px}.panel{background:var(--panel);border-radius:18px;min-width:0;scroll-margin-top:24px}.stat{padding:28px 32px;min-height:160px}.stat-label{font-size:14px;font-weight:400;color:var(--muted);margin:0 0 20px}.stat-value{font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:48px;line-height:1.1;font-weight:600;letter-spacing:-.374px;font-variant-numeric:tabular-nums}.stat-detail{font-size:12px;color:var(--muted);margin-left:8px}.critical{color:var(--danger)}.panels[data-stale=true] .stat-value{opacity:.55}
.panel-header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:28px 32px 16px}.panel-header h2{font-size:21px;line-height:1.19;font-weight:600;letter-spacing:-.224px;margin:0}.panel-meta{font-size:12px;color:var(--muted);letter-spacing:-.12px}.chart-panel{margin-bottom:24px}.chart-body{padding:8px 24px 24px}.chart-body>svg{display:block;width:100%;height:280px}svg text{font:12px "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}.legend{display:flex;flex-wrap:wrap;column-gap:24px;row-gap:12px;padding:16px 8px 0;font-size:12px;letter-spacing:-.12px}.legend-item{display:flex;align-items:center;gap:8px}.swatch{width:16px;height:3px;border-radius:9999px}.legend-value:empty{display:none}.legend-value{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.lower{display:grid;grid-template-columns:1fr 1.5fr;gap:24px}.panel-table{width:100%;border-collapse:collapse;font-size:14px;letter-spacing:-.224px}.panel-table th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--muted);font-weight:400;font-size:12px;padding:8px 32px 12px}.panel-table td{padding:12px 32px;overflow-wrap:anywhere}.panel-table th:last-child,.panel-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}.panel-table tbody tr:hover{background:#fafafc}.table-scroll{max-height:280px;overflow:auto;margin-bottom:16px;scrollbar-color:var(--hairline) var(--panel)}.empty-cell{height:130px;text-align:center!important;color:var(--muted)}.severity-name{display:flex;align-items:center;gap:10px}.severity-dot{height:8px;width:8px;border-radius:50%;flex-shrink:0}.area-label{display:block}.bar-track{height:4px;background:var(--canvas);margin-top:8px;max-width:360px;border-radius:9999px}.bar-fill{height:100%;background:var(--primary);border-radius:inherit}
@media(max-width:1068px){main{padding-top:48px}h1{font-size:40px}.stat{padding:24px}.stat-value{font-size:40px}.stat-detail{display:block;margin:8px 0 0}.panel-header{padding:24px 24px 16px}.panel-table th,.panel-table td{padding-left:24px;padding-right:24px}}
@media(max-width:833px){.token-field{flex-basis:100%}.toolbar label:not(.token-field){flex:1}.toolbar input[type=date]{width:100%}.lower{grid-template-columns:1fr}.chart-body>svg{height:240px}.stats,.lower{gap:16px}.stats,.chart-panel{margin-bottom:16px}}
@media(max-width:640px){main{padding:40px 24px 24px}.heading{align-items:flex-start;flex-direction:column;gap:16px;margin-bottom:32px}h1{font-size:34px}.controls-panel{padding:20px}.toolbar{gap:12px}.token-field{min-width:0}.refresh{width:100%;margin-top:4px}.stats{grid-template-columns:1fr}.stat{padding:24px 20px;min-height:144px}.stat-label{margin-bottom:16px}.stat-value{font-size:34px}.panel-header{align-items:flex-start;flex-direction:column;gap:8px;padding:24px 20px 16px}.panel-header h2{font-size:21px}.chart-body{padding:0 12px 24px}.chart-body>svg{height:220px}.legend{column-gap:20px;row-gap:12px}.panel-table th,.panel-table td{padding-left:20px;padding-right:20px}.message{margin-bottom:24px}}
@media(max-width:419px){h1{font-size:28px}main{padding-left:16px;padding-right:16px}.toolbar label:not(.token-field){flex-basis:100%}.stat-value{font-size:32px}}
</style>
</head>
<body>
  <main id="overview">
    <div class="heading"><div><h1>Dashboard Analitik</h1></div><span id="connection" class="status-badge">Belum dimuat</span></div>
    <div class="controls-panel">
    <form id="controls" class="toolbar">
      <label class="token-field">Token Client API<input id="token" type="password" autocomplete="off" spellcheck="false" required placeholder="Access token · hazards:read:summary"></label>
      <label><input id="from" type="date" aria-label="Tanggal awal (UTC)"></label>
      <label><input id="to" type="date" aria-label="Tanggal akhir (UTC)"></label>
      <button id="load" class="refresh" type="submit"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6 6 0 1 0 0 5M16 3v5h-5"/></svg><span id="load-label">Refresh</span></button>
    </form>
    </div>
    <div id="status" class="message" role="status" aria-live="polite"></div>
    <div id="panels" class="panels" data-stale="false" aria-busy="false">
      <div class="stats">
        <section class="panel stat" aria-label="Total kejadian"><h2 class="stat-label">Total kejadian</h2><span id="total" class="stat-value">—</span><span class="stat-detail">event unik</span></section>
        <section class="panel stat" aria-label="Kejadian tingkat AWAS"><h2 class="stat-label">Severity AWAS</h2><span id="critical" class="stat-value critical">—</span><span class="stat-detail">kejadian</span></section>
        <section class="panel stat" aria-label="Jumlah wilayah"><h2 class="stat-label">Wilayah tercatat</h2><span id="area-count" class="stat-value">—</span><span class="stat-detail">area</span></section>
      </div>
      <section id="trend" class="panel chart-panel">
        <div class="panel-header"><h2>Kejadian per jenis bahaya</h2></div>
        <div class="chart-body"><svg id="chart" viewBox="0 0 1100 250" role="img" aria-label="Jumlah kejadian harian untuk lima jenis bahaya"><text x="550" y="120" text-anchor="middle">Belum ada data yang dimuat</text></svg><div id="legend" class="legend"></div></div>
      </section>
      <div id="distribution" class="lower">
        <section class="panel"><div class="panel-header"><h2>Distribusi severity</h2><span class="panel-meta">Jumlah kejadian</span></div><div class="table-scroll"><table class="panel-table"><thead><tr><th scope="col">Severity</th><th scope="col">Kejadian</th></tr></thead><tbody id="severity"><tr><td class="empty-cell" colspan="2">Belum ada data</td></tr></tbody></table></div></section>
        <section class="panel"><div class="panel-header"><h2>Kejadian per wilayah</h2><span class="panel-meta">Jumlah per wilayah</span></div><div class="table-scroll"><table class="panel-table"><thead><tr><th scope="col">Wilayah</th><th scope="col">Kejadian</th></tr></thead><tbody id="areas"><tr><td class="empty-cell" colspan="2">Belum ada data</td></tr></tbody></table></div></section>
      </div>
    </div>
  </main>
<script>
const $ = id => document.getElementById(id);
const types = ['SEISMIC', 'TSUNAMI', 'VOLCANIC', 'WILDFIRE', 'COASTAL'];
const names = ['Gempa', 'Tsunami', 'Gunung berapi', 'Kebakaran hutan', 'Pesisir'];
const colors = ['#0066cc', '#5a7288', '#8b63a6', '#b86e24', '#287d76'];
const severityColors = {NORMAL: '#287d76', WASPADA: '#997400', SIAGA: '#b86e24', AWAS: '#b42318'};
const number = value => new Intl.NumberFormat('id-ID').format(value);
let hasData = false, currentDaily = null;

for (let i = 0; i < types.length; i++) {
  const item = document.createElement('span'), swatch = document.createElement('span'), value = document.createElement('span');
  item.className = 'legend-item'; swatch.className = 'swatch'; swatch.style.background = colors[i];
  value.className = 'legend-value'; value.id = 'legend-' + types[i];
  item.append(swatch, document.createTextNode(names[i]), value); $('legend').append(item);
}

function table(id, counts) {
  const target = $(id), entries = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  let maximum = 1;
  for (const [, count] of entries) maximum = Math.max(maximum, count);
  target.replaceChildren();
  if (!entries.length) {
    const row = document.createElement('tr'), cell = document.createElement('td');
    cell.colSpan = 2; cell.className = 'empty-cell'; cell.textContent = 'Tidak ada kejadian pada rentang ini.';
    row.append(cell); target.append(row); return;
  }
  for (const [name, count] of entries) {
    const row = document.createElement('tr'), label = document.createElement('td'), value = document.createElement('td');
    const text = document.createElement('span'); text.textContent = name;
    if (id === 'severity') {
      const dot = document.createElement('span'); dot.className = 'severity-dot'; dot.style.background = severityColors[name] || '#6e6e73'; dot.setAttribute('aria-hidden', 'true');
      const group = document.createElement('span'); group.className = 'severity-name'; group.append(dot, text); label.append(group);
    } else {
      text.className = 'area-label';
      const track = document.createElement('div'), bar = document.createElement('div');
      track.className = 'bar-track'; track.setAttribute('aria-hidden', 'true'); bar.className = 'bar-fill'; bar.style.width = (count / maximum * 100) + '%';
      track.append(bar); label.append(text, track);
    }
    value.textContent = number(count); row.append(label, value); target.append(row);
  }
}

function svgElement(tag, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
  if (text !== undefined) node.textContent = text;
  return node;
}

function draw(daily) {
  const svg = $('chart'), width = svg.clientWidth || 1100, height = svg.clientHeight || 250;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`); svg.replaceChildren();
  if (!daily || !daily.length) { svg.append(svgElement('text', {x: width / 2, y: height / 2, 'text-anchor': 'middle'}, daily ? 'Tidak ada kejadian pada rentang ini.' : 'Belum ada data yang dimuat')); return; }
  const byDate = new Map(daily.map(day => [day.date, day.counts]));
  const first = Date.parse(daily[0].date + 'T00:00:00Z'), last = Date.parse(daily[daily.length - 1].date + 'T00:00:00Z');
  const days = [];
  for (let time = first; time <= last; time += 86400000) {
    const date = new Date(time).toISOString().slice(0, 10); days.push({date, counts: byDate.get(date) || {}});
  }
  let maximum = 1;
  for (const day of daily) for (const type of types) maximum = Math.max(maximum, day.counts[type] || 0);
  const ticks = Math.min(4, maximum), ceiling = Math.ceil(maximum / ticks) * ticks;
  const x = i => days.length === 1 ? 65 + (width - 80) / 2 : 65 + i * (width - 80) / (days.length - 1), y = n => height - 40 - n * (height - 60) / ceiling;
  for (let i = 0; i <= ticks; i++) {
    const value = ceiling * i / ticks;
    if (i === 0) svg.append(svgElement('line', {x1: 65, y1: y(value), x2: width - 15, y2: y(value), stroke: '#e0e0e0', 'stroke-width': 1}));
    svg.append(svgElement('text', {x: 55, y: y(value) + 4, 'text-anchor': 'end'}, number(value)));
  }
  for (let k = 0; k < types.length; k++) {
    const line = svgElement('polyline', {points: days.map((day, i) => `${x(i)},${y(day.counts[types[k]] || 0)}`).join(' '), fill: 'none', stroke: colors[k], 'stroke-width': 1.8, 'stroke-linejoin': 'round'});
    line.append(svgElement('title', {}, names[k])); svg.append(line);
    if (days.length === 1) svg.append(svgElement('circle', {cx: x(0), cy: y(days[0].counts[types[k]] || 0), r: 3, fill: colors[k]}));
  }
  const labels = [...new Set([0, Math.floor((days.length - 1) / 2), days.length - 1])];
  for (const i of labels) svg.append(svgElement('text', {x: x(i), y: height - 15, 'text-anchor': days.length === 1 ? 'middle' : i === 0 ? 'start' : i === days.length - 1 ? 'end' : 'middle'}, days[i].date));
}

draw(null);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => draw(currentDaily)).observe($('chart'));

function setStatus(state, badge, message) {
  $('connection').className = 'status-badge ' + state; $('connection').textContent = badge;
  $('status').className = 'message ' + state; $('status').textContent = message;
}

$('controls').addEventListener('submit', async event => {
  event.preventDefault();
  if ($('from').value && $('to').value && $('from').value > $('to').value) { setStatus('warn', 'Rentang tidak valid', 'Tanggal awal tidak boleh melewati tanggal akhir.'); return; }
  $('load').disabled = true; $('load-label').textContent = 'Memuat…'; $('panels').setAttribute('aria-busy', 'true'); $('panels').dataset.stale = String(hasData);
  setStatus('', 'Memuat', hasData ? 'Memuat data. Angka yang tampil masih berasal dari permintaan sebelumnya.' : 'Mengambil agregasi dari seluruh lokasi penyimpanan…');
  try {
    const params = new URLSearchParams();
    if ($('from').value) params.set('from', $('from').value + 'T00:00:00Z');
    if ($('to').value) params.set('to', $('to').value + 'T23:59:59.999999999Z');
    const response = await fetch('/analytics?' + params, {headers: {Authorization: 'Bearer ' + $('token').value.trim()}, cache: 'no-store', signal: AbortSignal.timeout(30000)});
    if (!response.ok) throw new Error(response.status === 401 ? 'Token tidak valid atau kedaluwarsa (HTTP 401)' : 'HTTP ' + response.status);
    const data = await response.json();
    if (!Array.isArray(data.daily) || !data.by_hazard || !data.by_severity || !data.by_area || !Number.isSafeInteger(data.total) || typeof data.partial !== 'boolean') throw new Error('Respons analitik tidak valid');
    $('total').textContent = number(data.total); $('critical').textContent = number(data.by_severity.AWAS || 0);
    $('area-count').textContent = number(Object.values(data.by_area).filter(count => count > 0).length);
    for (const type of types) $('legend-' + type).textContent = number(data.by_hazard[type] || 0);
    table('severity', data.by_severity); table('areas', data.by_area); currentDaily = data.daily; draw(currentDaily);
    hasData = true; $('panels').dataset.stale = 'false';
    if (data.partial) setStatus('warn', 'Data parsial', 'Angka mungkin belum lengkap. Unit tidak tersedia atau sedang pulih: ' + (data.unavailable_units || []).join(', '));
    else if (data.replication_degraded) setStatus('warn', 'Replika tertinggal', 'Data tersedia, tetapi versi replika belum seragam: ' + (data.lagging_units || []).join(', '));
    else setStatus('ok', 'Data lengkap', 'Agregasi lintas seluruh lokasi penyimpanan. Setiap event dihitung satu kali.');
  } catch (error) {
    $('panels').dataset.stale = String(hasData);
    setStatus('warn', hasData ? 'Data lama' : 'Gagal memuat', error.message + '. ' + (hasData ? 'Angka yang tampil belum diperbarui, bukan data terkini.' : 'Belum ada angka yang dapat ditampilkan.'));
  } finally {
    $('load').disabled = false; $('load-label').textContent = 'Refresh'; $('panels').setAttribute('aria-busy', 'false');
  }
});
</script>
</body>
</html>
