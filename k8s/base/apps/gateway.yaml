apiVersion: v1
kind: Service
metadata:
  name: aggregator-backends
spec:
  clusterIP: None
  selector:
    app: aggregator
  ports:
  - name: http
    port: 8083
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator-gateway
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aggregator-gateway
  template:
    metadata:
      labels:
        app: aggregator-gateway
        role: other
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: aggregator-gateway
      containers:
      - name: aggregator-gateway
        image: aat/aggregator:m2-dev
        command: [/app/gateway]
        lifecycle:
          preStop:
            exec:
              command: [/bin/sh, -c, sleep 5]
        env:
        # Soft Go-runtime target, NOT additional container memory. Reserve space
        # for sockets/kernel accounting and transient memory outside GC control.
        - name: GOMEMLIMIT
          value: "160MiB"
        - name: GATEWAY_REPLICAS
          value: "2"
        - name: AGGREGATOR_RESPONSE_SLOTS
          valueFrom:
            configMapKeyRef:
              name: aggregator-config
              key: AGGREGATOR_RESPONSE_SLOTS
              optional: true
        - name: AGGREGATOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: aggregator-credentials
              key: AGGREGATOR_API_KEY
        ports:
        - name: http
          containerPort: 8083
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
