apiVersion: v1
kind: Service
metadata:
  name: aggregator
spec:
  selector:
    app: aggregator
  ports:
  - name: http
    port: 8083
    targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: aggregator
        image: bnpb/aggregator:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: aggregator-config
        - secretRef:
            name: aggregator-credentials
        ports:
        - name: http
          containerPort: 8083
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8083
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aggregator
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - name: http
    port: 8084
    targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        role: api
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: auth
        image: bnpb/auth:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: auth-config
        - secretRef:
            name: auth-credentials
        ports:
        - name: http
          containerPort: 8084
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 8084
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8084
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: wait-for-database
        image: postgres:16-alpine
        command:
        - sh
        - -ec
        - until pg_isready -h auth-postgres -p 5432 -U auth_app; do sleep 2; done
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
---
