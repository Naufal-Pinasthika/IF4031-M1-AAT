apiVersion: v1
kind: Service
metadata:
  name: aggregator
spec:
  selector:
    app: aggregator-gateway
  ports:
  - name: http
    port: 8083
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aggregator
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aggregator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      terminationGracePeriodSeconds: 20
      dnsConfig:
        options:
        - name: use-vc
        - name: timeout
          value: "1"
        - name: attempts
          value: "2"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: aggregator
      automountServiceAccountToken: false
      containers:
      - name: aggregator
        image: aat/aggregator:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: aggregator-config
        - secretRef:
            name: aggregator-credentials
        env:
        - name: AGGREGATOR_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 8083
        resources:
          requests:
            # Protect database/control-plane scheduling under read saturation.
            cpu: 250m
            memory: 256Mi
          limits:
            # Tested 10k-VU budget; 750m starved read/control work under load.
            # CPU is optional in M2's table; keep the prescribed memory limit.
            cpu: "2"
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 3
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        # Old surge pods must not let a new revision finish on only 2 nodes.
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: aggregator
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - name: http
    port: 8084
    targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        role: api
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: auth
        image: aat/auth:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: auth-config
        - secretRef:
            name: auth-credentials
        ports:
        - name: http
          containerPort: 8084
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 8084
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8084
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: wait-for-database
        image: postgres:16-alpine
        command:
        - sh
        - -ec
        - until pg_isready -h auth-postgres -p 5432 -U auth_app; do sleep 2; done
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
---
