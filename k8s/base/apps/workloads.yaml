apiVersion: v1
kind: Service
metadata:
  name: dashboard-consumer
spec:
  selector:
    app: dashboard-consumer
  ports:
  - name: http
    port: 8085
    targetPort: 8085
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dashboard-consumer
spec:
  serviceName: dashboard-consumer
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-consumer
  template:
    metadata:
      labels:
        app: dashboard-consumer
        role: consumer
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: dashboard-consumer
        image: bnpb/dashboard-consumer:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dashboard-consumer-config
        ports:
        - name: http
          containerPort: 8085
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
