  serviceName: dashboard-consumer
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-consumer
  template:
    metadata:
      labels:
        app: dashboard-consumer
        role: consumer
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: dashboard-consumer
        image: aat/dashboard-consumer:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dashboard-consumer-config
        ports:
        - name: http
          containerPort: 8085
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 8085
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
