apiVersion: v1
kind: Service
metadata:
  name: sensor-pantai
spec:
  selector:
    app: sensor-pantai
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  labels:
    role: sensor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sensor-pantai
  template:
    metadata:
      labels:
        app: sensor-pantai
        role: sensor
    spec:
      automountServiceAccountToken: false
      containers:
      - name: sensor
        image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: sensor-pantai-config
        env:
        - name: PANTAI_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: pantai-token
              key: token
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: exam-key
          mountPath: /var/run/pantai
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: exam-key
        secret:
          secretName: pantai-key
          optional: true
---
