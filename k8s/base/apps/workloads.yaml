apiVersion: v1
kind: Service
metadata:
  name: bmkg
spec:
  selector:
    app: bmkg
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bmkg
  template:
    metadata:
      labels:
        app: bmkg
        role: mock
    spec:
      # p1: keep services without HA available when a storage worker is lost.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      automountServiceAccountToken: false
      containers:
      - name: bmkg
        image: bnpb/bmkg:m2-dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: bmkg-config
        - secretRef:
            name: bmkg-credentials
        ports:
        - name: http
          containerPort: 8081
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
        startupProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
---
