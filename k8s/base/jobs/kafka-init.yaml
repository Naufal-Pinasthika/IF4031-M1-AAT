apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kafka-init
        role: broker
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: create-topic
        image: apache/kafka:4.0.0
        envFrom:
        - configMapRef:
            name: kafka-init-config
        env:
        - name: KAFKA_HEAP_OPTS
          value: -Xms64m -Xmx128m
        command:
        - /bin/sh
        - -ec
        args:
        - 'until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
          >/dev/null 2>&1; do sleep 3; done

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
          --if-not-exists --topic "$KAFKA_TOPIC" --partitions 3 --replication-factor
          1

          exec /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
          --if-not-exists --topic "$KAFKA_CRITICAL_TOPIC" --partitions 3 --replication-factor 1

          '
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
