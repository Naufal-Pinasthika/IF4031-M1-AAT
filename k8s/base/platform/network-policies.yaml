apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-owner-only
spec:
  podSelector:
    # p1: protect the retained M1 database as well as the three new units.
    matchExpressions:
    - key: app
      operator: In
      values: [postgres, postgres-a, postgres-b, postgres-c, aggregator-coordinator]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aggregator
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tester-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-postgres-owner-only
spec:
  podSelector:
    matchLabels:
      app: auth-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tester-agent
